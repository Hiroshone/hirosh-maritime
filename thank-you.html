<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Thank You | Hirosh Maritime and Shipping Agency</title>

  <link rel="icon" type="image/png" href="/favicon.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #073451;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
    }

    .thank-you-card {
      background: #ffffff;
      width: 100%;
      max-width: 650px;
      padding: 45px 35px;
      border-radius: 12px;
      text-align: center;
    }

    .logo {
      width: 150px;
      max-width: 100%;
      margin-bottom: 25px;
    }

    .check {
      width: 65px;
      height: 65px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: #f28c00;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      font-weight: bold;
    }

    h1 {
      color: #073451;
      font-size: 32px;
      margin-bottom: 15px;
    }

    p {
      color: #555555;
      font-size: 17px;
      line-height: 1.7;
      margin-bottom: 25px;
    }

    .buttons a {
      display: inline-block;
      text-decoration: none;
      padding: 14px 24px;
      margin: 6px;
      border-radius: 6px;
      font-weight: 700;
    }

    .home-btn {
      background: #f28c00;
      color: #ffffff;
    }

    .whatsapp-btn {
      background: #25D366;
      color: #ffffff;
    }

    .tagline {
      margin-top: 25px;
      margin-bottom: 0;
      color: #073451;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    @media (max-width: 600px) {
      .thank-you-card {
        padding: 35px 20px;
      }

      h1 {
        font-size: 27px;
      }

      .buttons a {
        display: block;
        margin: 10px 0;
      }
    }
  </style>
</head>

<body>

  <div class="thank-you-card">

    <img src="/hirosh-maritime-logo.png"
         alt="Hirosh Maritime and Shipping Agency"
         class="logo">

    <div class="check">✓</div>

    <h1>Thank You for Your Enquiry</h1>

    <p>
      Your enquiry has been submitted successfully.
      Our team will review your requirement and contact you shortly.
    </p>

    <div class="buttons">
      <a href="/" class="home-btn">Back to Home</a>

      <a href="https://wa.me/918075562243?text=Hello%20Hirosh%20Maritime%2C%20I%20would%20like%20to%20enquire%20about%20your%20services."
         class="whatsapp-btn"
         target="_blank"
         rel="noopener noreferrer">WhatsApp Us</a>
    </div>

    <p class="tagline">Connecting Ports. Moving Possibilities.</p>

  </div>

</body>
</html>
